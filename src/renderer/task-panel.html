<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>进行中的 Codex 任务</title>
    <link rel="stylesheet" href="task-panel.css" />
  </head>

    <script src="task-panel.js"></script>
  </body>
